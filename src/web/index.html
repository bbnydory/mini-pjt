<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<title>TEMPO · 확인용 화면</title>
<style>
  :root {
    --bg: #F2F2F2; --panel: #ffffff; --ink: #242424; --muted: #616161; --line: #E0E0E0;
    --accent: #0067B8; --accent-ink: #ffffff; --soft: #EBF3FC; --warn: #C50F1F; --warn-soft: #FDE7E9;
    --code: #FAFAFA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b; --panel: #1e2226; --ink: #e8e6e1; --muted: #9aa1a9; --line: #30353b;
      --accent: #479EF5; --accent-ink: #0A1A2B; --soft: #0F2A44; --warn: #f0976a; --warn-soft: #33221a;
      --code: #262b30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 18px; }
  h1 { font-family: "Do Hyeon", sans-serif; font-weight: 400; font-size: 30px; margin: 0; color: var(--accent); }
  button, h2 { font-family: "Jua", "Noto Sans KR", sans-serif; font-weight: 400; }
  header p { margin: 0; color: var(--muted); }
  #health { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 14px; }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
  }
  textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  button.send {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px;
    padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .55; cursor: default; }
  .hint { color: var(--muted); font-size: 13px; }
  .pick { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .pick select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; font: inherit; font-size: 13px; max-width: 230px; }
  .pick select.warn { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .group:last-child { margin-bottom: 0; }
  .tag { font-size: 11.5px; color: var(--muted); width: 78px; padding-top: 5px; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  button.chip {
    border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 2px;
    padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; text-align: left;
  }
  button.chip:hover { border-color: var(--accent); background: var(--soft); }
  #status { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 2px; background: var(--soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.plain { background: var(--code); color: var(--muted); }
  #answer { overflow-wrap: anywhere; }
  #answer h3, #answer h4, #answer h5 { margin: 16px 0 6px; font-size: 15.5px; }
  #answer p { margin: 8px 0; }
  #answer ul, #answer ol { margin: 6px 0; padding-left: 22px; }
  #answer hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  #answer blockquote { margin: 10px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  #answer code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .tablewrap { overflow-x: auto; margin: 10px 0; }
  table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
  th { background: var(--code); font-weight: 600; }
  details { border-top: 1px solid var(--line); padding: 10px 0 2px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .item { border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; margin-top: 8px; }
  .item .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; margin-bottom: 4px; }
  .item .name { font-weight: 600; }
  .item .who { color: var(--muted); }
  pre {
    margin: 4px 0 0; padding: 8px 10px; background: var(--code); border-radius: 4px; font-size: 12.5px;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  .label { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .empty { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TEMPO</h1>
    <p>마라톤 훈련 조정 코치 · 확인용 화면</p>
    <span id="health">서버 상태 확인 중</span>
  </header>

  <section class="panel">
    <textarea id="question" placeholder="예: 지난주 일요일 장거리를 못 뛰었어. 이번 주 계획을 어떻게 조정하면 좋을까?"></textarea>
    <div class="row">
      <button class="send" id="send">질문 보내기</button>
      <label class="pick">모델 <select id="msel"></select></label>
      <label class="pick">리전 <select id="rsel"></select></label>
      <span class="hint">Ctrl + Enter 로도 보낼 수 있습니다</span>
      <span id="status"></span>
    </div>
  </section>

  <section class="panel">
    <h2>예시 질문 (evaluation/test_queries.csv)</h2>
    <div id="examples"><p class="empty">불러오는 중</p></div>
  </section>

  <section class="panel" id="result" hidden>
    <div class="badges" id="badges"></div>
    <div id="answer"></div>
    <details id="ctxBox">
      <summary id="ctxTitle">근거 문서</summary>
      <div id="contexts"></div>
    </details>
    <details id="traceBox">
      <summary id="traceTitle">실행 과정</summary>
      <div id="trace"></div>
    </details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CATEGORY = { positive: "정상 질문", negative: "범위 밖", edge: "경계 사례", guardrail: "가드레일" };

/* 답변에 쓰이는 마크다운(제목, 굵게, 목록, 표, 인용, 구분선)만 처리하는 작은 변환기.
   먼저 전체를 이스케이프하므로 답변에 섞인 HTML은 실행되지 않는다. */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(text) {
  const lines = String(text ?? "").split(/\r?\n/);
  const out = [];
  let i = 0;
  const cells = (ln) => ln.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  while (i < lines.length) {
    const ln = lines[i];
    if (!ln.trim()) { i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(ln)) { out.push("<hr>"); i++; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length + 2, 5); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const head = cells(ln); i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push('<div class="tablewrap"><table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join("") +
        "</tr></thead><tbody>" + rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }
    if (/^\s*>/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push(`<blockquote>${buf.map(inline).join("<br>")}</blockquote>`);
      continue;
    }
    const isUl = (s) => /^\s*[-*]\s+/.test(s), isOl = (s) => /^\s*\d+[.)]\s+/.test(s);
    if (isUl(ln) || isOl(ln)) {
      const ordered = isOl(ln), test = ordered ? isOl : isUl, buf = [];
      while (i < lines.length && (test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) {
        if (test(lines[i])) buf.push(lines[i].replace(/^\s*([-*]|\d+[.)])\s+/, ""));
        else buf[buf.length - 1] += " " + lines[i].trim();
        i++;
      }
      const tagName = ordered ? "ol" : "ul";
      out.push(`<${tagName}>${buf.map((b) => `<li>${inline(b)}</li>`).join("")}</${tagName}>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4})\s|^\s*\||^\s*>|^\s*[-*]\s+|^\s*\d+[.)]\s+/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("");
}

function badge(text, kind = "") { return `<span class="badge ${kind}">${esc(text)}</span>`; }

function render(data) {
  const meta = data.meta || {};
  const b = [];
  if (meta.blocked) b.push(badge(`입력 가드레일 차단 · ${meta.rule_id} ${meta.category}`, "warn"));
  else b.push(badge("입력 가드레일 통과"));
  const og = meta.output_guard;
  if (og && og.proposes_plan) {
    const totals = Object.values(og.weekly_totals_km || {}).join(", ");
    const kind = og.status === "ok" ? "" : "warn";
    const note = { ok: "한도 이내", rewritten: "한도 초과로 고쳐 씀", blocked: "한도 초과로 계획 차단" }[og.status] || og.status;
    b.push(badge(`주간 합계 ${totals}km / 한도 ${og.limit_km}km · ${note}`, kind));
  }
  (meta.agents || []).forEach((a) => b.push(badge(a, "plain")));
  if (meta.latency_s != null) b.push(badge(`${meta.latency_s}초`, "plain"));
  if (meta.model) b.push(badge(`${meta.model.replace(/^(us|global)\.(anthropic|amazon)\./, "")} · ${meta.region}`, "plain"));
  $("badges").innerHTML = b.join("");
  $("answer").innerHTML = md(data.answer);

  const ctx = data.contexts || [];
  $("ctxTitle").textContent = `근거 문서 (${ctx.length})`;
  $("contexts").innerHTML = ctx.length
    ? ctx.map((c) => `<div class="item"><div class="head"><span class="name">${esc(c.doc_id)}</span>` +
        `<span class="who">${esc(c.source || "")}</span></div><pre>${esc(c.text)}</pre></div>`).join("")
    : '<p class="empty">이 답변에는 문서 검색이 쓰이지 않았습니다.</p>';

  const tr = data.trace || [];
  $("traceTitle").textContent = `실행 과정 (${tr.length}단계)`;
  $("trace").innerHTML = tr.map((s, n) =>
    `<div class="item"><div class="head"><span class="who">${n + 1}</span><span class="name">${esc(s.step)}</span>` +
    `<span class="who">${esc(s.agent || "")}</span>` +
    (s.latency_s != null ? `<span class="who">${esc(s.latency_s)}초</span>` : "") + "</div>" +
    (s.input ? `<div class="label">입력</div><pre>${esc(s.input)}</pre>` : "") +
    `<div class="label">출력</div><pre>${esc(s.output)}</pre></div>`).join("");
  $("result").hidden = false;
}

let timer = null;
async function send() {
  const question = $("question").value.trim();
  if (!question || $("send").disabled) return;
  $("send").disabled = true;
  const started = Date.now();
  const tick = () => { $("status").textContent = `처리 중 ${Math.round((Date.now() - started) / 1000)}초 (복합 질문은 1분 안팎 걸립니다)`; };
  tick(); timer = setInterval(tick, 1000);
  try {
    const res = await fetch("/query", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, ...choice() }),
    });
    const data = await res.json();
    $("msel").classList.toggle("warn", res.status === 429); $("rsel").classList.toggle("warn", res.status === 429);
    if (!res.ok) throw new Error(data.detail || res.statusText);
    render(data);
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = `오류: ${e.message}`;
  } finally {
    clearInterval(timer);
    $("send").disabled = false;
  }
}

/* 모델·리전 선택. 주간 화면과 같은 저장값(tempo.model, tempo.region)을 써서 한쪽에서 고르면 양쪽에 같이 적용된다 */
let MODELS = null;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function choice() {
  if (!MODELS) return {};
  const out = {};
  if ($("msel").value !== MODELS.default.model) out.model = $("msel").value;
  if ($("rsel").value !== MODELS.default.region) out.region = $("rsel").value;
  return out;
}
function syncRegions() {
  const m = MODELS.models.find((x) => x.id === $("msel").value);
  for (const o of $("rsel").options) o.disabled = !!(m && m.regions && !m.regions.includes(o.value));
  if ($("rsel").selectedOptions[0] && $("rsel").selectedOptions[0].disabled) $("rsel").value = m.regions[0];
}
fetch("/models").then((r) => r.json()).then((data) => {
  MODELS = data;
  $("msel").innerHTML = data.models.map((m) => `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join("");
  $("rsel").innerHTML = data.regions.map((r) => `<option value="${r}">${r}</option>`).join("");
  const sm = store.get("tempo.model"), sr = store.get("tempo.region");
  $("msel").value = data.models.some((m) => m.id === sm) ? sm : data.default.model;
  $("rsel").value = data.regions.includes(sr) ? sr : data.default.region;
  syncRegions();
}).catch(() => {});
$("msel").addEventListener("change", () => { syncRegions(); store.set("tempo.model", $("msel").value); store.set("tempo.region", $("rsel").value); });
$("rsel").addEventListener("change", () => store.set("tempo.region", $("rsel").value));

$("send").addEventListener("click", send);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); });

fetch("/health").then((r) => r.json()).then((h) => {
  $("health").textContent = `기준일 ${h.today} · 검색 ${h.retriever} · ${h.status === "ok" ? "준비됨" : "준비 중"}`;
}).catch(() => { $("health").textContent = "서버에 연결할 수 없습니다"; });

fetch("/examples").then((r) => r.json()).then((rows) => {
  const box = $("examples");
  box.innerHTML = "";
  for (const cat of Object.keys(CATEGORY)) {
    const items = rows.filter((r) => r.category === cat);
    if (!items.length) continue;
    const group = document.createElement("div");
    group.className = "group";
    group.innerHTML = `<span class="tag">${CATEGORY[cat]}</span><div class="chips"></div>`;
    for (const r of items) {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = r.input;
      chip.title = `${r.id}번 · ${r.note}`;
      chip.addEventListener("click", () => { $("question").value = r.input; $("question").focus(); });
      group.querySelector(".chips").appendChild(chip);
    }
    box.appendChild(group);
  }
}).catch(() => { $("examples").innerHTML = '<p class="empty">예시 질문을 불러오지 못했습니다.</p>'; });
</script>
</body>
</html>
